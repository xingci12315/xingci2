<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>第一人称打僵尸</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
    #blocker {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; color: #fff; z-index: 100;
    }
    #instructions {
      text-align: center; cursor: pointer; padding: 24px; border: 2px solid #76ff03; border-radius: 12px;
    }
    #instructions h1 { margin: 0 0 12px; color: #76ff03; }
    #hud {
      position: fixed; top: 12px; left: 12px; color: #fff; font-size: 18px; z-index: 50;
      text-shadow: 1px 1px 3px #000; pointer-events: none;
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 20px; height: 20px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 50;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.8);
    }
    #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
    #crosshair::after { width: 20px; height: 2px; top: 9px; left: 0; }
    #damage-overlay {
      position: fixed; inset: 0; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.5) 100%);
      opacity: 0; pointer-events: none; z-index: 40; transition: opacity 0.15s;
    }
    #game-over {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 200;
    }
    #game-over h2 { font-size: 36px; color: #ff5252; margin-bottom: 12px; }
    #restartBtn {
      margin-top: 16px; padding: 10px 28px; border: none; border-radius: 8px;
      background: #76ff03; color: #111; font-size: 18px; cursor: pointer;
    }
    #weapon {
      position: fixed; bottom: -20px; right: 25%; width: 120px; height: 180px;
      background: linear-gradient(90deg, #555, #777, #555); border-radius: 8px 8px 0 0;
      z-index: 30; pointer-events: none; transform-origin: bottom center;
    }
    #muzzle-flash {
      position: fixed; bottom: 140px; right: 30%; width: 40px; height: 40px;
      background: radial-gradient(circle, #ffeb3b, transparent); border-radius: 50%;
      opacity: 0; z-index: 31; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="blocker"><div id="instructions">
    <h1> 第一人称打僵尸</h1>
    <p>点击开始游戏</p>
    <p>WASD 移动 · 鼠标瞄准 · 左键射击</p>
  </div></div>
  <div id="hud">
    <div>分数：<span id="score">0</span></div>
    <div>生命：<span id="hp">100</span></div>
    <div>波次：<span id="wave">1</span></div>
    <div>弹药：<span id="ammo">30</span> / <span id="reserve">120</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="damage-overlay"></div>
  <div id="weapon"></div>
  <div id="muzzle-flash"></div>
  <div id="game-over">
    <h2>你被僵尸吃掉了</h2>
    <p>最终分数：<span id="finalScore">0</span></p>
    <button id="restartBtn">重新开始</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // --- 场景 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 20, 60);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
    camera.position.y = 1.7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- 灯光 ---
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    const moonLight = new THREE.DirectionalLight(0x8888cc, 0.6);
    moonLight.position.set(10, 20, 5);
    moonLight.castShadow = true;
    scene.add(moonLight);

    // --- 地面 ---
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d3a2d });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- 障碍物 ---
    const obstacles = [];
    function addObstacle(x, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x555555 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      obstacles.push(mesh);
    }
    // 随机生成一些障碍物
    for (let i = 0; i < 20; i++) {
      const x = (Math.random() - 0.5) * 60;
      const z = (Math.random() - 0.5) * 60;
      if (Math.abs(x) < 5 && Math.abs(z) < 5) continue; // 避开出生点
      addObstacle(x, z, 1 + Math.random() * 2, 1 + Math.random() * 3, 1 + Math.random() * 2);
    }

    // --- 控制 ---
    const controls = new PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');
    const instructions = document.getElementById('instructions');

    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => blocker.style.display = 'none');
    controls.addEventListener('unlock', () => blocker.style.display = 'flex');

    // --- 移动 ---
    const keys = {};
    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const speed = 6;

    // --- 游戏状态 ---
    let score = 0, hp = 100, wave = 1, running = true;
    let ammo = 30, reserve = 120;
    let zombies = [];
    let spawnSpeed = 2000, zombieSpeed = 2.2;
    let spawnTimer = null;

    const scoreEl = document.getElementById('score');
    const hpEl = document.getElementById('hp');
    const waveEl = document.getElementById('wave');
    const ammoEl = document.getElementById('ammo');
    const reserveEl = document.getElementById('reserve');
    const damageOverlay = document.getElementById('damage-overlay');
    const weaponEl = document.getElementById('weapon');
    const muzzleEl = document.getElementById('muzzle-flash');

    // --- 僵尸 ---
    function createZombie() {
      if (!running) return;
      const angle = Math.random() * Math.PI * 2;
      const dist = 25 + Math.random() * 15;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      const group = new THREE.Group();
      group.position.set(x, 0, z);

      // 身体
      const bodyGeo = new THREE.BoxGeometry(0.6, 1.4, 0.4);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a7c3f });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.1;
      body.castShadow = true;
      group.add(body);

      // 头
      const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x5a8c4f });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.0;
      head.castShadow = true;
      group.add(head);

      // 眼睛（发光）
      const eyeGeo = new THREE.SphereGeometry(0.06, 6, 6);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.1, 2.05, 0.2);
      group.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.1, 2.05, 0.2);
      group.add(rightEye);

      scene.add(group);
      zombies.push({ group, hp: 3, speed: zombieSpeed + Math.random() * 0.5 });
    }

    // --- 射击 ---
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
      if (!controls.isLocked || !running) return;
      if (e.button !== 0) return;
      if (ammo <= 0) return;

      ammo--;
      ammoEl.textContent = ammo;

      // 枪口闪光
      muzzleEl.style.opacity = 1;
      setTimeout(() => muzzleEl.style.opacity = 0, 60);

      // 武器后坐力动画
      weaponEl.style.transform = 'translateY(8px)';
      setTimeout(() => weaponEl.style.transform = 'translateY(0)', 80);

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const zombieMeshes = [];
      zombies.forEach(z => z.group.traverse(c => { if (c.isMesh) zombieMeshes.push(c); }));

      const hits = raycaster.intersectObjects(zombieMeshes);
      if (hits.length > 0) {
        // 找到对应的僵尸
        for (const z of zombies) {
          let found = false;
          z.group.traverse(c => { if (c === hits[0].object) found = true; });
          if (found) {
            z.hp--;
            if (z.hp <= 0) {
              scene.remove(z.group);
              zombies = zombies.filter(zm => zm !== z);
              score++;
              scoreEl.textContent = score;
              if (score % 15 === 0) {
                wave++;
                waveEl.textContent = wave;
                zombieSpeed += 0.3;
                spawnSpeed = Math.max(600, spawnSpeed - 150);
                clearInterval(spawnTimer);
                spawnTimer = setInterval(createZombie, spawnSpeed);
              }
            }
            break;
          }
        }
      }
    });

    // --- 装弹 ---
    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyR' && running && ammo < 30 && reserve > 0) {
        const need = 30 - ammo;
        const take = Math.min(need, reserve);
        ammo += take;
        reserve -= take;
        ammoEl.textContent = ammo;
        reserveEl.textContent = reserve;
      }
    });

    // --- 受伤闪烁 ---
    function flashDamage() {
      damageOverlay.style.opacity = 1;
      setTimeout(() => damageOverlay.style.opacity = 0, 200);
    }

    // --- 游戏结束 ---
    function endGame() {
      running = false;
      clearInterval(spawnTimer);
      controls.unlock();
      document.getElementById('finalScore').textContent = score;
      document.getElementById('game-over').style.display = 'flex';
    }

    document.getElementById('restartBtn').addEventListener('click', () => {
      zombies.forEach(z => scene.remove(z.group));
      zombies = [];
      score = 0; hp = 100; wave = 1;
      ammo = 30; reserve = 120;
      zombieSpeed = 2.2; spawnSpeed = 2000;
      running = true;
      camera.position.set(0, 1.7, 0);
      camera.rotation.set(0, 0, 0);
      scoreEl.textContent = 0;
      hpEl.textContent = 100;
      waveEl.textContent = 1;
      ammoEl.textContent = 30;
      reserveEl.textContent = 120;
      document.getElementById('game-over').style.display = 'none';
      spawnTimer = setInterval(createZombie, spawnSpeed);
      controls.lock();
    });

    // --- 主循环 ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      if (!running) { renderer.render(scene, camera); return; }

      const delta = Math.min(clock.getDelta(), 0.1);

      // 移动
      direction.set(0, 0, 0);
      if (keys['KeyW']) direction.z -= 1;
      if (keys['KeyS']) direction.z += 1;
      if (keys['KeyA']) direction.x -= 1;
      if (keys['KeyD']) direction.x += 1;
      direction.normalize();

      if (controls.isLocked) {
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0));

        velocity.set(0, 0, 0);
        velocity.addScaledVector(forward, -direction.z * speed * delta);
        velocity.addScaledVector(right, direction.x * speed * delta);

        const newPos = camera.position.clone().add(velocity);
        // 简单边界
        newPos.x = Math.max(-48, Math.min(48, newPos.x));
        newPos.z = Math.max(-48, Math.min(48, newPos.z));
        camera.position.copy(newPos);
      }

      // 僵尸移动
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const dx = camera.position.x - z.group.position.x;
        const dz = camera.position.z - z.group.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 1.2) {
          hp -= 10;
          hpEl.textContent = hp;
          flashDamage();
          scene.remove(z.group);
          zombies.splice(i, 1);
          if (hp <= 0) { endGame(); return; }
          continue;
        }

        z.group.position.x += (dx / dist) * z.speed * delta;
        z.group.position.z += (dz / dist) * z.speed * delta;
        z.group.lookAt(camera.position.x, 0, camera.position.z);
      }

      renderer.render(scene, camera);
    }

    spawnTimer = setInterval(createZombie, spawnSpeed);
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
  <a href="Un-1.html">
      <button>返回</button>
  </a>
</body>
</html>
