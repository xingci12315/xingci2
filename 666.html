<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>躲避方块游戏</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      font-family: sans-serif;
    }

    .game-container {
      position: relative;
      width: 360px;
      height: 520px;
      background: #1e1e2f;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    .player {
      position: absolute;
      bottom: 20px;
      left: 160px;
      width: 40px;
      height: 40px;
      background: #00e676;
      border-radius: 6px;
      transition: left 0.08s linear;
    }

    .enemy {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #ff5252;
      border-radius: 6px;
    }

    .score {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-size: 16px;
    }

    .game-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .game-over h2 {
      margin-bottom: 8px;
    }

    .restart-btn {
      margin-top: 12px;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #00e676;
      color: #111;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game">
    <div class="score">分数：<span id="scoreText">0</span></div>
    <div class="player" id="player"></div>
    <div class="game-over" id="gameOver">
      <h2>游戏结束</h2>
      <p>得分：<span id="finalScore">0</span></p>
      <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>
  </div>

  <script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const scoreText = document.getElementById("scoreText");
    const gameOverBox = document.getElementById("gameOver");
    const finalScore = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");

    let playerX = 160;
    let score = 0;
    let running = true;
    let enemies = [];
    let speed = 3;
    let spawnTimer = 0;

    document.addEventListener("keydown", function (e) {
      if (!running) return;

      if (e.key === "ArrowLeft") {
        playerX = Math.max(0, playerX - 20);
      }
      if (e.key === "ArrowRight") {
        playerX = Math.min(320, playerX + 20);
      }
      player.style.left = playerX + "px";
    });

    function createEnemy() {
      const enemy = document.createElement("div");
      enemy.className = "enemy";
      const x = Math.floor(Math.random() * 9) * 40;
      enemy.style.left = x + "px";
      enemy.style.top = "-40px";
      game.appendChild(enemy);
      enemies.push({ el: enemy, y: -40 });
    }

    function checkCollision(enemyY) {
      const playerRect = player.getBoundingClientRect();
      const enemyRect = enemies[enemies.length - 1].el.getBoundingClientRect();

      return !(
        playerRect.right < enemyRect.left ||
        playerRect.left > enemyRect.right ||
        playerRect.bottom < enemyRect.top ||
        playerRect.top > enemyRect.bottom
      );
    }

    function gameLoop() {
      if (!running) return;

      spawnTimer++;
      if (spawnTimer % 40 === 0) {
        createEnemy();
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.y += speed;
        enemy.el.style.top = enemy.y + "px";

        const playerRect = player.getBoundingClientRect();
        const enemyRect = enemy.el.getBoundingClientRect();

        if (
          playerRect.left < enemyRect.right &&
          playerRect.right > enemyRect.left &&
          playerRect.top < enemyRect.bottom &&
          playerRect.bottom > enemyRect.top
        ) {
          endGame();
          return;
        }

        if (enemy.y > 520) {
          enemy.el.remove();
          enemies.splice(i, 1);
          score++;
          scoreText.textContent = score;

          if (score % 10 === 0) {
            speed += 0.5;
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      running = false;
      finalScore.textContent = score;
      gameOverBox.style.display = "flex";
    }

    restartBtn.addEventListener("click", function () {
      enemies.forEach(e => e.el.remove());
      enemies = [];
      score = 0;
      speed = 3;
      spawnTimer = 0;
      playerX = 160;
      player.style.left = playerX + "px";
      scoreText.textContent = 0;
      gameOverBox.style.display = "none";
      running = true;
      requestAnimationFrame(gameLoop);
    });

    requestAnimationFrame(gameLoop);
  </script>
  <a href="Un-1.html">
<button>返回</button>
  </a>
</body>
</html>
